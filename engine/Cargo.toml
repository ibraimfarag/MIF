[package]
name = "mics-engine"
description = "MI CS Engine — Mourad Ibrahim Cyber Security"
version = "0.1.0"
edition = "2024"

# Embeds a Windows version resource so Task Manager shows the engine by name
# ("MiShild Background") instead of by file name. See build.rs.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# Release hardening (ج1, D-021). The shipped engine is one binary, so this trades
# build time and crash forensics for the attacker's cost:
#   * LTO + one codegen unit removes the split-object seams and the cross-crate
#     boundaries a patch or a gadget chain would be aimed at, and shrinks the file;
#   * strip means the artifact carries no symbols and no PDB path (no source tree
#     layout, no function names);
#   * panic = "abort" removes the unwinder and every landing pad with it.
# The honest cost: a panicking task now ends the process instead of that one task.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
async-trait = "0.1.92"
windows = { version = "0.62.2", features = ["Win32_System_Registry", "Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_WindowsFirewall", "Win32_System_Com", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Security_Cryptography_Catalog", "Win32_Security_Cryptography_Sip", "Win32_Security_WinTrust", "Win32_System_Pipes", "Win32_System_ProcessStatus", "Win32_System_Services", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Media_Audio", "Win32_UI_Notifications", "Data_Xml_Dom", "UI_Notifications"] }
sysinfo = "0.39.6"
yara-x = "1.22.1"
aes-gcm = { version = "0.11.1", features = ["aes", "alloc", "getrandom"] }
sha2 = "0.11.1"
hex = "0.4.3"
windows-dpapi = "0.2"
reqwest = { version = "0.12", features = ["rustls-tls", "json"] }
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.37", features = ["bundled"] }
walkdir = "2"
regex = "1"
getrandom = "0.3"
ferrisetw = "1.2.0"
