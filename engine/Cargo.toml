[package]
name = "mics-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
async-trait = "0.1.92"
windows = { version = "0.62.2", features = ["Win32_System_Registry", "Win32_Foundation", "Win32_NetworkManagement_IpHelper"] }
sysinfo = "0.39.6"
yara-x = "1.22.1"
aes-gcm = "0.11.1"
sha2 = "0.11.1"
hex = "0.4.3"
windows-dpapi = "0.2.0"
