[package]
name = "mics-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
async-trait = "0.1.92"
windows = { version = "0.62.2", features = ["Win32_System_Registry", "Win32_Foundation"] }
sysinfo = "0.39.6"
