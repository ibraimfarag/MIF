name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned to the version this project is verified against locally (3.47.8,
          # framework 737ba8f). `channel: stable` alone means CI silently follows the
          # newest patch release, which is how a red build appears without a code
          # change - and one of the 136 Dart cases failed on the runner while passing
          # here (CI run 41922021833, "135 tests passed, 1 failed"), with 3.47.9
          # published four days before that run.
          flutter-version: 3.47.8
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Same reason: the release binaries should be built by a known toolchain,
          # and moving it is a decision (recorded in docs/DECISIONS.md), not a
          # side effect of `stable` moving.
          toolchain: 1.99.1

      - name: Cache cargo registry and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/target
          key: cargo-${{ runner.os }}-${{ hashFiles('engine/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # The same script a human runs before a commit, so the two cannot drift.
      # `full` adds the release builds that used to live only here.
      - name: Pipeline (full)
        shell: pwsh
        run: ./scripts/pipeline.ps1 -Tier full

      # The measured half of QA next to the committed report: the contract run's
      # own JSON and the step report, so a reviewer sees what executed.
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mics-windows
          path: |
            qa/report.md
            qa/report.html
            build/qa-contract.json
            build/windows/x64/runner/Release/
            engine/target/release/mics-engine.exe
            build/pipeline-full.json
          if-no-files-found: warn