name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/target
          key: cargo-${{ runner.os }}-${{ hashFiles('engine/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # The same script a human runs before a commit, so the two cannot drift.
      # `full` adds the release builds that used to live only here.
      - name: Pipeline (full)
        shell: pwsh
        run: ./scripts/pipeline.ps1 -Tier full

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mics-windows
          path: |
            build/windows/x64/runner/Release/
            engine/target/release/mics-engine.exe
            build/pipeline-full.json
          if-no-files-found: warn