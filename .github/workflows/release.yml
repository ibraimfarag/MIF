name: Release

# Cuts a downloadable release from a branch or from a tag.
#
# Run it by hand (Actions -> Release -> Run workflow, giving the version the tag
# should carry) or by pushing a v* tag. Everything published here is produced on a
# GitHub-hosted runner from the commit the run checked out - no local dist/ folder
# is uploaded - so the SHA256SUMS in the release describe files this workflow hashed
# itself. That is the point of the whole file: a release that can be reproduced and
# checked without trusting the machine it was cut on.
#
# Signing: `make-release.ps1 -Sign` signs the staged binaries. With no CA certificate
# configured it self-signs on the runner (CurrentUser\Root + TrustedPublisher, D-016):
# that proves a file was not touched after the build, but it is NOT a publicly trusted
# publisher identity, so Windows still says "Unknown publisher" and SmartScreen still
# warns - that is row ب5 in docs/ROADMAP.md. Two routes make that row free, and
# docs/SIGNING.md carries the source and the date for each (D-036, 2026-11-07):
#   A. the Microsoft Store re-signs an MSIX package after certification, with a free
#      developer account - so publishing through the Store needs no certificate at all;
#   B. OSSign issues the *project* a certificate once the repository is six months old
#      (~2027-04-27) and signs it keyless over OIDC, so no secret is stored here.
# Both are recorded rather than wired: route A is packaging work that does not live in
# this workflow, and route B cannot apply before it is eligible. The paid route stays a
# drop-in meanwhile: make-release.ps1 reads MICS_PFX_B64 (a base64 PFX) with
# MICS_PFX_PASSWORD, or MICS_CERT_THUMBPRINT for a certificate already in a store
# (a token or a signing agent), and prints the identity it chose - so a *donated*
# certificate still needs no step below to change (docs/COST.md §5, D-034).
# The repository secret is still called MICS_PFX; the two legs below hand its value
# to the variable make-release.ps1 actually reads, which until 2026-11-09 they did
# not - so a real donated PFX would have been ignored and the release silently
# self-signed (D-047's correction).
#
# ARM64: `windows-11-arm` is a real runner (D-003's correction, 2026-11-04), so the
# ARM64 legs are here - but they have never run, and Flutter's own Windows ARM64 SDK
# availability has not been measured either. They are `continue-on-error` on purpose
# and they gate nothing until they have a green run behind them; when they do, drop
# the flag and add them to `publish`'s needs.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.1.0 - must match engine/Cargo.toml"
        required: true
        type: string
      tag:
        description: "Tag to create or reuse (default: v<version>)"
        required: false
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Resolve the version and tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
          fi
          [ -n "$tag" ] || tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "releasing $version as $tag"
      - name: The tag has to be the version the engine builds as
        shell: bash
        run: |
          set -euo pipefail
          crate=$(grep -m1 '^version' engine/Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          app=$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/p' pubspec.yaml | head -1)
          echo "engine/Cargo.toml=$crate  pubspec.yaml=$app  tag=${{ steps.resolve.outputs.version }}"
          if [ "$crate" != "${{ steps.resolve.outputs.version }}" ]; then
            echo "::error::the tag says ${{ steps.resolve.outputs.version }} but engine/Cargo.toml says $crate"
            exit 1
          fi
          if [ "$app" != "$crate" ]; then
            echo "::warning::pubspec.yaml says $app while the release is $crate; the app's own version resource and the installer's will disagree until they are made one number"
          fi

  package-x64:
    name: Package (x64)
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8   # the version this project is verified against
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1   # a known compiler builds a signed release

      # Unset CARGO_TARGET_DIR (make-release builds into engine\target when it is
      # empty), so the cache path below is the one that gets reused.
      - name: Cache cargo registry and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/target
          key: cargo-release-x64-${{ hashFiles('engine/Cargo.lock') }}
          restore-keys: cargo-release-x64-

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --no-progress -y

      # The inventory in step 1 runs `cargo metadata` and asks it not to touch the
      # network, so it needs the crates resolved and present first: measured 2026-11-05
      # (run 41974398428), a fresh runner answered "cargo metadata failed (101): no
      # matching package named `aes-gcm` found ... offline mode (via --offline)" and the
      # check was reported as a stale inventory. It is also the download the build would
      # otherwise do later, so this costs nothing.
      - name: Fetch the Rust dependencies
        shell: pwsh
        env:
          YRX_REGENERATE_MODULES_RS: "false"
        run: |
          cd engine
          cargo fetch --locked

      - name: Signing works on this machine
        shell: pwsh
        # Five minutes, because everything here takes seconds: creating the certificate,
        # trusting it and signing a PE. It runs *before* the build so a hang costs a
        # coffee instead of a release - measured 2026-11-05, signing stalled two runs
        # (3 h in 41980725064, 50 min in 42010747061) after the build was already done.
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Continue'
          $log = 'build/signing-probe-log.txt'
          & ./scripts/signing-probe.ps1 *>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          if ($code -ne 0) { ./scripts/annotate-failure.ps1 -Path $log; exit $code }

      - name: Build, sign, hash and zip
        shell: pwsh
        # A build that hangs must cost 50 minutes, not the 6 hours GitHub allows a job:
        # measured 2026-11-05, run 41980725064 sat in this step for 3 h 40 min and was
        # still going, with the whole release held behind it.
        timeout-minutes: 50
        env:
          YRX_REGENERATE_MODULES_RS: "false"
          # Empty until a certificate exists (ب5): an unset secret expands to "", and
          # make-release.ps1 falls back to the self-signed development certificate and
          # prints which identity it used. Two repository secrets, no workflow edit.
          # The name make-release.ps1 reads is MICS_PFX_B64, and it base64-decodes it,
          # so the secret's value is the base64 text of the PFX; the secret itself
          # keeps the name MICS_PFX.
          MICS_PFX_B64: ${{ secrets.MICS_PFX }}
          MICS_PFX_PASSWORD: ${{ secrets.MICS_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force -Path build | Out-Null
          # The pin, enforced and printed: `flutter-version: 3.47.8` is what the workflow
          # asks for, and this is the only place that checks what arrived - the inventory
          # in sbom.cdx.json records the SDK it was generated with (run 41980725064 shows
          # this line holding: "Flutter 3.47.8 (wanted 3.47.8)").
          $want = '3.47.8'
          $have = ((flutter --version) | Select-Object -First 1) -replace '^Flutter\s+', '' -replace '\s.*$', ''
          "Flutter $have (wanted $want), FLUTTER_ROOT=$env:FLUTTER_ROOT"
          if ($have -ne $want) {
            Write-Output "::error::the runner installed Flutter $have, not $want - the pin did not hold"
            exit 1
          }
          $log = 'build/release-x64-log.txt'
          & ./scripts/make-release.ps1 -Sign -Arch x64 -Version "${{ needs.version.outputs.version }}" *>&1 |
            Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          if ($code -ne 0) { ./scripts/annotate-failure.ps1 -Path $log; exit $code }

      # A step cancelled by its timeout never reaches the `if ($code -ne 0)` above, so the
      # one case where the log matters most - a build that stopped talking - would leave
      # no annotation at all. This runs for either ending.
      - name: Say where the build stopped
        if: failure() || cancelled()
        shell: pwsh
        run: ./scripts/annotate-failure.ps1 -Path build/release-x64-log.txt

      - name: Wrap the package in an installer
        shell: pwsh
        run: ./scripts/make-installer.ps1 -Arch x64 -Version ${{ needs.version.outputs.version }}

      # -SkipToast: a runner has no interactive session to raise the card in, and
      # that half is verified on a real desktop (see docs/TODO.md, the release gate).
      # It keeps a log for the same reason the build does: this step was reached for the
      # first time on 2026-11-05 (run 42028521051) and failed with nothing but GitHub's
      # "exit code 1", because it ran without a tee.
      - name: Verify the download the way a user's machine sees it
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $log = 'build/release-verify-x64-log.txt'
          & ./scripts/verify-release.ps1 -Arch x64 -SkipToast *>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          if ($code -ne 0) { ./scripts/annotate-failure.ps1 -Path $log; exit $code }

      # A step cancelled by its timeout never reaches the branch above, so the one case
      # where the log matters most - a verification that stopped talking - would leave no
      # annotation at all. This runs for either ending.
      - name: Say where the verification stopped
        if: failure() || cancelled()
        shell: pwsh
        run: ./scripts/annotate-failure.ps1 -Path build/release-verify-x64-log.txt

      - name: Collect the download
        uses: actions/upload-artifact@v4
        with:
          name: release-x64
          path: |
            dist/MICS-portable-*.zip
            dist/MICS-setup-*.exe
            dist/update.json
            dist/update.json.sig
          if-no-files-found: error

      - name: Keep the QA report with the binaries it describes
        uses: actions/upload-artifact@v4
        with:
          name: qa-report
          path: qa/report.md

  engine-arm64:
    name: ARM64 engine, run natively (informational)
    needs: version
    continue-on-error: true
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/target
          key: cargo-arm64-native-${{ hashFiles('engine/Cargo.lock') }}
          restore-keys: cargo-arm64-native-

      # The claim this closes: "compiled for aarch64" was all that could be said
      # about ARM64 here, because no ARM64 machine existed. On this runner the
      # engine's own tests execute as ARM64 code.
      - name: Run the engine test suite on ARM64
        shell: pwsh
        env:
          YRX_REGENERATE_MODULES_RS: "false"
        run: |
          cd engine
          cargo test --release

      # `cargo test` builds a test harness in `target/release/deps`, not the bin the
      # verifier looks for: measured 2026-11-05, "no mics_app.exe or mics-engine.exe
      # under engine/target/release" - the tests had passed and the check still had
      # nothing to check. The bin is built explicitly first.
      - name: Build the ARM64 engine binary
        shell: pwsh
        env:
          YRX_REGENERATE_MODULES_RS: "false"
        run: |
          cd engine
          cargo build --release

      - name: The result has to be a hardened ARM64 PE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force -Path build | Out-Null
          $log = 'build/release-arm64-engine-log.txt'
          & ./scripts/verify-hardening.ps1 -Path engine/target/release -Arch arm64 *>&1 |
            Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          if ($code -ne 0) { ./scripts/annotate-failure.ps1 -Path $log; exit $code }

  package-arm64:
    name: Package (arm64, informational)
    needs: version
    continue-on-error: true
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4

      # Flutter publishes no Windows ARM64 SDK: 0 of the 747 archives in
      # releases_windows.json mention arm64 (measured 2026-11-04), and the action
      # says so itself - "Unable to determine Flutter version for channel: stable
      # version: any architecture: arm64" (run 41922523593, job 126898444291). So
      # this asks for the x64 SDK explicitly and lets Windows run it under
      # emulation. Whether the app then builds as ARM64 is the open question this
      # job exists to answer: `flutter build windows` takes its target from the
      # host platform (packages/flutter_tools/lib/src/commands/build_windows.dart,
      # `hostPlatform == HostPlatform.windows_arm64`), and `verify-hardening.ps1
      # -Arch arm64` refuses an x64 package - so a green job means a real ARM64 app,
      # and a red one means Flutter's tooling cannot do it yet.
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          architecture: x64
          flutter-version: 3.47.8   # same pin as the x64 job: CI must not drift
          cache: true

      # Flutter publishes no Windows ARM64 SDK: `releases_windows.json` mentions
      # arm64 in 0 of its 749 archives (measured 2026-11-14), so the action can only
      # install the x64 SDK - and on this ARM64 host its Dart runs under emulation.
      # That run measured the consequence exactly: `PROCESSOR_ARCHITECTURE=ARM64`
      # while `dart --version` said `on "windows_x64"`, so `precache` fetched
      # `windows-x64` and the gate's Flutter row stayed missing with the host row
      # present. What *is* published, for this exact engine revision, is the ARM64
      # side: `dart-sdk-windows-arm64.zip` (161,631,589 bytes) and
      # `windows-arm64/artifacts.zip` (34,257,934 bytes) both answer 200, and the
      # archive's own `version` file says `3.13.7` - the same Dart the x64 SDK
      # carries. So the tool is made native by putting that Dart SDK in
      # `bin/cache/dart-sdk` before `precache` runs, which is what makes `precache`
      # ask for `windows-arm64`. Nothing here is asserted: the step prints what the
      # tool reports, and whether the Windows build then honours the host
      # architecture is a measurement, not an assumption of this one.
      - name: Make the Flutter tool native (matching ARM64 Dart SDK)
        if: ${{ runner.arch == 'ARM64' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $dart = "$env:FLUTTER_ROOT\bin\cache\dart-sdk\bin\dart.exe"
          "dart before: $(& $dart --version)"
          if ((& $dart --version) -match 'windows_arm64') {
            "the tool already runs native; nothing to swap"
            exit 0
          }
          $rev = (Get-Content "$env:FLUTTER_ROOT\bin\internal\engine.version" -Raw).Trim()
          $url = "https://storage.googleapis.com/flutter_infra_release/flutter/$rev/dart-sdk-windows-arm64.zip"
          $zip = Join-Path $env:RUNNER_TEMP 'dart-sdk-windows-arm64.zip'
          "downloading $url"
          curl.exe -sSL --fail --retry 3 -o $zip $url
          if ($LASTEXITCODE -ne 0) {
            "download failed (curl exit $LASTEXITCODE); the SDK is left as it was and the gate below reports the truth either way"
            exit 0
          }
          $tmp = Join-Path $env:RUNNER_TEMP 'dart-sdk-arm64'
          Remove-Item $tmp -Recurse -Force -ErrorAction SilentlyContinue
          # Expand-Archive rather than tar: this runs beside the x64 job, so a
          # minute spent extracting is cheaper than an unreliable assumption.
          Expand-Archive -Path $zip -DestinationPath $tmp -Force
          # the archive carries a top-level `dart-sdk/`; accept a bare layout too
          $src = Join-Path $tmp 'dart-sdk'
          if (-not (Test-Path (Join-Path $src 'bin\dart.exe'))) { $src = $tmp }
          "archive root: $src"
          Remove-Item "$env:FLUTTER_ROOT\bin\cache\dart-sdk" -Recurse -Force
          Move-Item $src "$env:FLUTTER_ROOT\bin\cache\dart-sdk"
          "dart after: $(& $dart --version)"

          # Swapping the SDK is not enough on its own, and run 43597179356 measured
          # what it costs: the tool then refused to start at all with `Snapshot not
          # compatible with the current VM configuration: the snapshot requires
          # '... x64 windows ...' but the VM has '... arm64 windows ...'` - the
          # snapshot in the SDK is app-jit, so it is architecture-specific, and the
          # x64 one it ships cannot run on the native Dart. `bin/internal/shared.bat`
          # rebuilds it with whatever Dart sits in `bin/cache/dart-sdk` once the
          # snapshot or its stamp is missing, so both go; `flutter --version` is what
          # pays for the rebuild and proves it happened (`Building flutter tool...`
          # on stderr, a version on stdout). The dependencies are already vendored
          # in `packages/flutter_tools/.dart_tool/package_config.json`, so this is a
          # compile, not a network trip.
          Remove-Item "$env:FLUTTER_ROOT\bin\cache\flutter_tools.snapshot*" -Force -ErrorAction SilentlyContinue
          Remove-Item "$env:FLUTTER_ROOT\bin\cache\flutter_tools.stamp" -Force -ErrorAction SilentlyContinue
          "rebuilding the tool snapshot with the native Dart:"
          flutter --version
          "flutter --version exit: $LASTEXITCODE"

      # `make-release.ps1 -Arch arm64` refuses until the SDK carries the engine
      # artifacts the gate looks for, and nothing downloads them on its own - the
      # build would, but the gate runs first, so the gate was answering "has a
      # build run here before?" (measured 2026-11-14: it reported the row missing
      # in the same job whose ARM64 engine linked and ran natively). Asking for
      # them here makes the row say what it means. What arrives is decided by the
      # *tool's* platform rather than the host's - the same ARM64 runner fetched
      # `windows-x64` while `dart --version` answered `windows_x64`, and fetches
      # `windows-arm64` once the swap below has run (both measured 2026-11-14) - so
      # the step prints what it got instead of asserting.
      - name: Precache the Flutter engine for this host
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"
          dart --version
          flutter precache --windows
          $code = $LASTEXITCODE
          "engine artifacts under $env:FLUTTER_ROOT\bin\cache\artifacts\engine:"
          Get-ChildItem "$env:FLUTTER_ROOT\bin\cache\artifacts\engine" -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty Name
          # Report, do not abort: run 43597179356 exited here with the tool's failure
          # code and the job stopped before `make-release.ps1` ever ran, so the gate
          # never spoke and the one line that says which rows are missing was lost.
          # The gate is the thing that decides this job; this step's job is to leave
          # the artifacts where the gate looks and to say what it got.
          "precache exit: $code"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          # make-release.ps1 -Arch arm64 checks for this target's libs and stops
          # before packaging when it is missing.
          targets: aarch64-pc-windows-msvc

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --no-progress -y

      - name: Fetch the Rust dependencies
        shell: pwsh
        env:
          YRX_REGENERATE_MODULES_RS: "false"
        run: |
          cd engine
          cargo fetch --locked

      - name: Build, sign, hash and zip
        shell: pwsh
        timeout-minutes: 30
        env:
          YRX_REGENERATE_MODULES_RS: "false"
          # Same two secrets as the x64 leg; the ARM64 leg is informational for now
          # (it has never had a green run), so it may self-sign while x64 does not.
          MICS_PFX_B64: ${{ secrets.MICS_PFX }}
          MICS_PFX_PASSWORD: ${{ secrets.MICS_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force -Path build | Out-Null
          $want = '3.47.8'
          $have = ((flutter --version) | Select-Object -First 1) -replace '^Flutter\s+', '' -replace '\s.*$', ''
          "Flutter $have (wanted $want), FLUTTER_ROOT=$env:FLUTTER_ROOT"
          $log = 'build/release-arm64-log.txt'
          & ./scripts/make-release.ps1 -Sign -Arch arm64 -Version "${{ needs.version.outputs.version }}" *>&1 |
            Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          if ($code -ne 0) { ./scripts/annotate-failure.ps1 -Path $log; exit $code }

      - name: Say where the build stopped
        if: failure() || cancelled()
        shell: pwsh
        run: ./scripts/annotate-failure.ps1 -Path build/release-arm64-log.txt

      - name: Wrap the package in an installer
        shell: pwsh
        run: ./scripts/make-installer.ps1 -Arch arm64 -Version ${{ needs.version.outputs.version }}

      - name: Collect the download
        uses: actions/upload-artifact@v4
        with:
          name: release-arm64
          path: |
            dist/MICS-portable-*.zip
            dist/MICS-setup-*.exe
          if-no-files-found: warn

  publish:
    name: Publish
    needs: [version, package-x64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect what the runners produced
        uses: actions/download-artifact@v4
        with:
          path: download
          merge-multiple: true

      - name: Hash what is about to be published
        shell: bash
        run: |
          set -euo pipefail
          cd download
          ls -l
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: The tag this release belongs to
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.version.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "$tag already exists; the release points at it"
          else
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
          fi

      # Quoted heredoc: the notes contain backticks and dollar signs that must stay
      # literal, so the two values that do change are substituted afterwards.
      - name: Notes
        shell: bash
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          MI CS @VERSION@ - detection, audit and hardening for one Windows machine.

          ## What is in here

          | File | What it is |
          |---|---|
          | `MICS-portable-@VERSION@-x64.zip` | The portable package: unpack it into a folder of your own, run `mics_app.exe`. Not inside a web root — the engine will not start from a Low-integrity folder |
          | `MICS-setup-@VERSION@-x64.exe` | The installer: one UAC prompt, Start Menu and desktop shortcuts, uninstall entry |
          | `report.md` | The QA report of the run that built these files |
          | `SHA256SUMS` | Hashes of exactly the files above, made in this run |
          | `update.json` | What MI CS' own *Check now* reads: the portable zip's version, URL, size and SHA-256 (`docs/DECISIONS.md` D-046). It describes the zip beside it and names nothing else. |
          | `update.json.sig` | The detached PKCS#7 over `update.json`, made with the identity that signed the binaries. MI CS verifies it *before* it reads the manifest and pins the signer to the certificate over its own engine, so an unsigned or re-signed feed is refused (`docs/DECISIONS.md` D-047). |

          ## Before you install

          Requirements: **Windows 10 21H2 or newer, or Windows 11, x64**. Windows 8
          and 8.1 cannot run it at all - the Flutter runtime the UI is built on
          requires Windows 10 1809+.

          These builds are **not signed by a publicly trusted publisher**, so Windows
          shows "Unknown publisher" and SmartScreen warns. This project buys nothing
          (D-035), and two **free** routes to such a signature are researched with their
          sources and dates in `docs/SIGNING.md` (D-036): the Microsoft Store re-signs an
          MSIX package after certification, and OSSign issues the project a certificate
          once the repository is six months old. Neither is in place for the asset you are
          reading, so the binaries carry the project's own manifest signature and hash
          list instead - check the download against `SHA256SUMS` and against the source
          commit below.

          ## Evidence, not claims

          - Built from commit `@SHA@` by the Release workflow, on GitHub's own
            runners - never on a developer machine.
          - The QA report is generated by the same contract that
            `scripts/pipeline.ps1 -Tier full` enforces locally.
          - The engine's ARM64 tests run natively on an ARM64 runner in this
            workflow; those jobs are marked informational until they have a green
            history.
          NOTES
          sed -i "s/@VERSION@/${{ needs.version.outputs.version }}/g; s/@SHA@/$GITHUB_SHA/g" notes.md
          cat notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # --draft on purpose (D-031): the assets, the hashes and the notes are all
          # uploaded and checkable, but nothing is visible to the world until a human
          # publishes it. A self-signed build (D-016) should not appear on its own.
          gh release create "${{ needs.version.outputs.tag }}" \
            --draft \
            --title "MI CS ${{ needs.version.outputs.version }}" \
            --notes-file notes.md \
            download/*
          echo "::notice::draft ${{ needs.version.outputs.tag }} created - publish it from the Releases page when the hashes read right"
